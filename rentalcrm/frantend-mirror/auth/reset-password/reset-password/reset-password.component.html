<div class="account-content">
    <div class="login-wrapper reset-pass-wrap bg-img">
        <div class="login-content">
            <form>
                <div class="login-userset">
                    <div class="login-logo logo-normal">
                       <img src="assets/img/newLogo.webp" alt="img">
                   </div>
                   <a [routerLink] = "routes.adminDashboard" class="login-logo logo-white">
                       <img src="assets/img/newLogo.webp"  alt="">
                   </a>
                   <div class="card-body">
                       <p-toast></p-toast>
                   </div>
                   <div class="login-userheading">
                       <h3>Reset password?</h3>
                       <h4>Enter your new password to get inside</h4>
                   </div>
                   <div class="form-login">
                       <label>New Password</label>
                       <div class="pass-group">
                           <input [type]="password[2] ? 'text' : 'password' " class="pass-inputs" name="newPassword" [(ngModel)]="newPassword" placeholder="Enter new password">
                           <span class="fas toggle-passwords" [ngClass]=" password[2] ? 'fa-eye' : 'fa-eye-slash'" (click)="togglePassword(2)"></span>
                       </div>
                   </div>
                   <div class="form-login">
                       <label> New Confirm Password</label>
                       <div class="pass-group">
                           <input [type]="password[3] ? 'text' : 'password' " class="pass-inputa" name="confirmPassword" [(ngModel)]="confirmPassword" placeholder="Confirm new password">
                           <span class="fas toggle-passworda" [ngClass]=" password[3] ? 'fa-eye' : 'fa-eye-slash'" (click)="togglePassword(3)"></span>
                       </div>
                   </div>
                   <div class="form-login">
                       <button type="button" class="btn btn-login" (click)="navigation()" [disabled]="isLoading">{{ isLoading ? 'Verifying...' : 'Change Password' }}</button>
                   </div>
                   <div class="signinform text-center">
                       <h4>Return to <a [routerLink]="routes.signIn" class="hover-a">login</a></h4>
                   </div>
                   <div class="my-4 d-flex justify-content-center align-items-center copyright-text">
                       <p>Copyright &copy; 2026 Rome Your Way. All rights reserved</p>
                   </div>
               </div>
            </form>
           
        </div>
    </div>
</div>
