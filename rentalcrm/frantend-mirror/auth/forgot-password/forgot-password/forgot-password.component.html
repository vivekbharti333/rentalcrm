<div class="account-content">
    <div class="login-wrapper forgot-pass-wrap bg-img">
        <div class="login-content">
            <div class="login-userset-wrapper">
                <div class="login-userset">
                    <div class="login-logo logo-normal">
                       <img src="assets/img/newLogo.webp" alt="img">
                   </div>
                   <a [routerLink] = "routes.adminDashboard" class="login-logo logo-white">
                       <img src="assets/img/newLogo.webp"  alt="">
                   </a>
                   <div class="card-body">
                       <p-toast></p-toast>
                   </div>
                   <div class="login-userheading">
                       <h3>Forgot password?</h3>
                       <h4>Enter your registered mobile number and we'll send you an OTP to reset your password.</h4>
                   </div>
                   <form (ngSubmit)="onSubmit()">
                     <div class="form-login">
                         <label class="form-label">Mobile Number</label>
                         <div class="form-addons">
                             <input type="text" class="form-control" name="customerMobile" [(ngModel)]="customerMobile" required placeholder="Enter your registered mobile number" inputmode="numeric" maxlength="15">
                             <img src="assets/img/icons/user-icon.svg" alt="img">
                         </div>
                     </div>
                     <div class="form-login">
                         <button type="submit" class="btn btn-login" [disabled]="isLoading">{{ isLoading ? 'Sending OTP...' : 'Submit' }}</button>
                     </div>
                   </form>
                   <div class="signinform text-center">
                       <h4>Return to <a [routerLink]="routes.signIn" class="hover-a">login</a></h4>
                   </div>
                   <div class="form-setlogin or-text">
                       <h4>OR</h4>
                   </div>
                   <div class="form-sociallink">
                       <ul class="d-flex justify-content-center">
                           <li>
                               <a href="javascript:void(0);" class="facebook-logo">
                                   <img src="assets/img/icons/facebook-logo.svg" alt="Facebook">
                               </a>
                           </li>
                           <li>
                               <a href="javascript:void(0);">
                                   <img src="assets/img/icons/google.png" alt="Google">
                               </a>
                           </li>
                           <li>
                               <a href="javascript:void(0);" class="apple-logo">
                                   <img src="assets/img/icons/apple-logo.svg" alt="Apple">
                               </a>
                           </li>
                           
                       </ul>
                   </div>
                   <div class="my-4 d-flex justify-content-center align-items-center copyright-text">
                       <p>Copyright &copy; 2026 Rome Your Way. All rights reserved</p>
                   </div>
               </div>
            </div>
        </div>
    </div>
</div>
